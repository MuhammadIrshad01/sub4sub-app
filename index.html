<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub4Sub Web App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    button { background: #ff0000; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
    button:hover { background: #cc0000; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .channel-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding: 10px 0; }
    .btn-secondary { background: #555; }
    .btn-secondary:hover { background: #333; }
  </style>
</head>
<body>

  <h2>Sub4Sub Platform</h2>

  <!-- Auth Section -->
  <div id="auth-section" class="card">
    <h3>Sign In / Sign Up</h3>
    <input type="email" id="email" placeholder="Enter your Email" />
    <input type="password" id="password" placeholder="Enter Password" />
    
    <button onclick="loginWithEmail()">Log In</button>
    <button class="btn-secondary" onclick="signUpWithEmail()">Sign Up (New Account)</button>
  </div>

  <!-- App Main Section -->
  <div id="app-section" class="card" style="display: none;">
    <h3>User Profile</h3>
    <p><strong>Email:</strong> <span id="user-email"></span></p>
    <p><strong>Points Balance:</strong> <span id="user-points">0</span> 🪙</p>
    <button class="btn-secondary" onclick="logout()">Logout</button>

    <hr />

    <h3>Promote Your Channel (-10 Points)</h3>
    <input type="text" id="channel-id" placeholder="Enter Channel ID or Title" />
    <button onclick="addChannel()">Add Channel</button>

    <hr />

    <h3>Available Channels to Subscribe (+10 Points)</h3>
    <div id="channels-list"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://pkmqfkhxfqjxpoiewqyp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7MIC8kX4XxewOJ_ydWQ97w_BmMHsmFz";

    let supabaseClient;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.error("Supabase init error:", e);
    }

    async function checkUser() {
      if (!supabaseClient) return;
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
        document.getElementById('user-email').innerText = user.email;

        // Load User Profile Points
        fetchPoints(user.id);
        loadChannels();
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('app-section').style.display = 'none';
      }
    }

    async function fetchPoints(userId) {
      let { data: profile } = await supabaseClient.from('profiles').select('points').eq('id', userId).single();
      if (profile) {
        document.getElementById('user-points').innerText = profile.points;
      } else {
        // Profiling entry doesn't exist, create initial 50 points
        await supabaseClient.from('profiles').insert([{ id: userId, points: 50 }]);
        document.getElementById('user-points').innerText = 50;
      }
    }

    async function loginWithEmail() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) return alert('Email aur Password dono bharein');

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert("Login Error: " + error.message);
      else checkUser();
    }

    async function signUpWithEmail() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) return alert('Email aur Password dono bharein');

      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) alert("Sign Up Error: " + error.message);
      else alert("Account created! Ab Log In button dabayein.");
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function addChannel() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      const channelId = document.getElementById('channel-id').value;
      if (!channelId) return alert('Enter channel details');

      // Deduct 10 points for adding channel
      let currentPoints = parseInt(document.getElementById('user-points').innerText) || 0;
      if (currentPoints < 10) return alert('Channel add karne ke liye kam se kam 10 points chahiye!');

      const { error } = await supabaseClient.from('channels').insert([{ user_id: user.id, channel_id: channelId, title: channelId }]);
      if (error) {
        alert(error.message);
      } else {
        // Update Points (-10)
        await supabaseClient.from('profiles').update({ points: currentPoints - 10 }).eq('id', user.id);
        alert('Channel added! 10 Points deducted.');
        document.getElementById('channel-id').value = '';
        fetchPoints(user.id);
        loadChannels();
      }
    }

    async function loadChannels() {
      const { data: channels } = await supabaseClient.from('channels').select('*');
      const listDiv = document.getElementById('channels-list');
      listDiv.innerHTML = '';
      if (channels) {
        channels.forEach(ch => {
          // Format YouTube channel link with subscribe popup trigger
          let ytUrl = ch.channel_id.startsWith('@') 
            ? `https://youtube.com/${ch.channel_id}?sub_confirmation=1`
            : `https://youtube.com/channel/${ch.channel_id}?sub_confirmation=1`;

          listDiv.innerHTML += `
            <div class="channel-item">
              <span>${ch.title}</span>
              <button style="width: auto;" onclick="subscribe('${ytUrl}')">Subscribe (+10 Pts)</button>
            </div>
          `;
        });
      }
    }

    // Updated Subscribe Function: Opens link AND adds +10 points
    async function subscribe(ytUrl) {
      window.open(ytUrl, '_blank');

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;

      let currentPoints = parseInt(document.getElementById('user-points').innerText) || 0;
      let updatedPoints = currentPoints + 10;

      // Supabase points update (+10)
      const { error } = await supabaseClient.from('profiles').update({ points: updatedPoints }).eq('id', user.id);
      
      if (!error) {
        document.getElementById('user-points').innerText = updatedPoints;
      }
    }

    checkUser();
  </script>
</body>
</html>
